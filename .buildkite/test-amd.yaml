# AMD CI step definitions for test-template-amd.j2 (ci-infra).
# Disaggregated P/D SLURM tests only. See .buildkite/amd-disagg/README.md.
#
# The disagg step definitions now live in
# .buildkite/amd-disagg/pipeline-disagg.yaml (native Buildkite format). The
# single uploader step below injects them into the running build via
# `buildkite-agent pipeline upload`. run-amd-test.sh detects `pipeline upload`
# and runs it on the login host (not inside Docker). source_file_dependencies
# stays here so the whole suite is only injected on relevant diffs.

steps:

- label: "ROCm Disagg P/D — inject SLURM suite"
  agent_pool: mi250_8
  source_file_dependencies:
  - vllm/distributed/kv_transfer/
  - vllm/platforms/rocm.py
  - .buildkite/amd-disagg/
  commands:
  - buildkite-agent pipeline upload .buildkite/amd-disagg/pipeline-disagg.yaml
